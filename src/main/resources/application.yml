server:
  port: ${PORT:8080}

logging:
  level:
    org:
      atmosphere: warn
  structured:
    format:
      file: logstash
  file:
    name: logs/application.json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wornux.stock.movement: true
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${OTEL_METRICS_EXPORT_STEP:15s}
        base-time-unit: seconds

vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux

spring:
  application:
    name: qa-final-project
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: inventory-management
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:7777}/realms/wornux/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_PUBLIC_URL:http://localhost:7777}}/realms/wornux/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_PUBLIC_URL:http://localhost:7777}}/realms/wornux/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_PUBLIC_URL:http://localhost:7777}}/realms/wornux/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:7777}/realms/wornux
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_PUBLIC_URL:http://localhost:7777}}/realms/wornux/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/stocks
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      org:
        hibernate:
          envers:
            audit_table_suffix: _log
            store_data_at_delete: true
  flyway:
    enabled: true
    locations: [classpath:db/migration/prod]

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: inventory-api-tools
      use-pkce-with-authorization-code-grant: true

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  observability:
    grafana-url: ${GRAFANA_URL:http://localhost:3000}
  keycloak:
    end-session-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:7777}/realms/wornux/protocol/openid-connect/logout
    admin-bootstrap:
      enabled: ${KEYCLOAK_BOOTSTRAP_ENABLED:true}
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:7777}
      realm: ${KEYCLOAK_REALM:wornux}
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
      user-username: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:admin@wornux.com}
      user-email: ${KEYCLOAK_BOOTSTRAP_ADMIN_EMAIL:admin@wornux.com}
      user-password: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD:}
