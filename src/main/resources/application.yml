server:
  port: ${PORT:8080}

logging:
  level:
    org:
      atmosphere: warn

vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux

spring:
  config:
    import:
      - optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: inventory-management
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:7777/realms/wornux
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7777/realms/wornux
  datasource:
    url: jdbc:postgresql://localhost:5432/stocks
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      org:
        hibernate:
          envers:
            audit_table_suffix: _log
            store_data_at_delete: true
  flyway:
    enabled: true
    locations: [classpath:db/migration/prod]

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: inventory-api-tools
      use-pkce-with-authorization-code-grant: true

app:
  keycloak:
    admin-bootstrap:
      enabled: ${KEYCLOAK_BOOTSTRAP_ENABLED:true}
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:7777}
      realm: ${KEYCLOAK_REALM:wornux}
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
      user-username: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:admin@wornux.com}
      user-email: ${KEYCLOAK_BOOTSTRAP_ADMIN_EMAIL:admin@wornux.com}
      user-password: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD:${KEYCLOAK_ADMIN_PASSWORD:}}
