groups:
  - name: qa-final-project
    rules:
      - alert: HighApplicationCpu
        expr: process_cpu_usage{job="application"} > 0.8
        for: 5m
        labels:
          severity: warning
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="application",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="application"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
      - alert: HighHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="application"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
      - alert: ApplicationDown
        expr: up{job="application"} == 0
        for: 1m
        labels:
          severity: critical
      - alert: AuthenticationFailureSpike
        expr: sum(rate(wornux_security_authentication_failures_total{job="application"}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
