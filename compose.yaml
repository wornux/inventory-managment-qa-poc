x-application-target: &application-target
  APP_HOST: ${APP_HOST:-host.docker.internal}
  APP_PORT: ${PORT:-8080}

services:
  app:
    profiles: [production]
    build:
      context: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stocks
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-qa-final-project}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://alloy:4318/v1/metrics
      OTEL_METRICS_EXPORT_STEP: ${OTEL_METRICS_EXPORT_STEP:-15s}
      KEYCLOAK_SERVER_URL: http://keycloak:7777
      KEYCLOAK_PUBLIC_URL: http://localhost:7777
      KEYCLOAK_INTERNAL_URL: http://keycloak:7777
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:$${PORT}/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [observability]

  postgres:
    image: postgres:18.1
    volumes:
      - db_postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocks"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [observability]

  keycloak-postgres:
    image: postgres:18.1
    volumes:
      - keycloak_postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [observability]

  keycloak:
    image: keycloak/keycloak:26.6
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    ports:
      - "7777:7777"
      - "9000:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    environment:
      KC_HTTP_PORT: 7777
      KC_HOSTNAME: http://localhost:7777
      KC_HOSTNAME_ADMIN: http://localhost:7777
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [observability]

  prometheus:
    image: prom/prometheus:v3.8.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./telemetry/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.30.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./telemetry/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./telemetry/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/loki.yml"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./telemetry/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.12.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./telemetry/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/application:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  jmeter:
    image: alpine/jmeter:5.6.3
    profiles: [performance]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -rf /results/* &&
        jmeter -n
        -t /tests/load-and-stress-test.jmx
        -Jhost=$${APP_HOST}
        -Jport=$${APP_PORT}
        -Jprotocol=http
        -JloadUsers=$${LOAD_USERS:-10}
        -JloadRampSeconds=$${LOAD_RAMP_SECONDS:-30}
        -JloadDurationSeconds=$${LOAD_DURATION_SECONDS:-90}
        -JstressUsers=$${STRESS_USERS:-100}
        -JstressRampSeconds=$${STRESS_RAMP_SECONDS:-120}
        -JstressDurationSeconds=$${STRESS_DURATION_SECONDS:-180}
        -l /results/results.jtl
        -e -o /results/report
    environment:
      <<: *application-target
      LOAD_USERS: ${JMETER_LOAD_USERS:-10}
      LOAD_RAMP_SECONDS: ${JMETER_LOAD_RAMP_SECONDS:-30}
      LOAD_DURATION_SECONDS: ${JMETER_LOAD_DURATION_SECONDS:-90}
      STRESS_USERS: ${JMETER_STRESS_USERS:-100}
      STRESS_RAMP_SECONDS: ${JMETER_STRESS_RAMP_SECONDS:-120}
      STRESS_DURATION_SECONDS: ${JMETER_STRESS_DURATION_SECONDS:-180}
      JVM_ARGS: ${JMETER_JVM_ARGS:--Xms512m -Xmx1g}
    volumes:
      - ./telemetry/jmeter:/tests:ro
      - ./reports/jmeter:/results
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [observability]

volumes:
  db_postgres:
  keycloak_postgres:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:

networks:
  observability:
    name: qa-final-project-observability
