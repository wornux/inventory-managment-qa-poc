name: Docker Publish

on:
  workflow_call:
    outputs:
      image:
        description: Published image pinned by digest
        value: ${{ jobs.docker-publish.outputs.image }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-publish:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wornux/qa-final-project
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export immutable image
        id: image
        run: echo "image=wornux/qa-final-project@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
