name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  provision:
    uses: ./.github/workflows/provision.yml
    secrets: inherit

  deploy:
    needs: [publish, provision]
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ needs.provision.outputs.droplet_ip }}
      APP_IMAGE: ${{ needs.publish.outputs.image }}
      DOMAIN: ${{ vars.DOMAIN }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DB_USERNAME: ${{ vars.DB_USERNAME || 'postgres' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEYCLOAK_DB_USERNAME: ${{ vars.KEYCLOAK_DB_USERNAME || 'keycloak' }}
      KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_AUTOMATION_CLIENT_SECRET: ${{ secrets.KEYCLOAK_AUTOMATION_CLIENT_SECRET }}
      KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD: ${{ secrets.KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD }}
      GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER || 'admin' }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host target\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking accept-new\n' "$HOST" > ~/.ssh/config
          for _ in {1..30}; do
            ssh target 'cloud-init status --wait' && exit 0
            sleep 10
          done
          exit 1

      - name: Build production environment
        env:
          KEYCLOAK_BOOTSTRAP_ENABLED: ${{ vars.KEYCLOAK_BOOTSTRAP_ENABLED || 'true' }}
        run: |
          python3 - <<'PY'
          import os, shlex
          values = {key: os.environ.get(key, "") for key in (
              "APP_IMAGE", "DB_USERNAME", "DB_PASSWORD", "KEYCLOAK_DB_USERNAME",
              "KEYCLOAK_DB_PASSWORD", "KEYCLOAK_ADMIN_PASSWORD", "KEYCLOAK_CLIENT_SECRET",
              "KEYCLOAK_AUTOMATION_CLIENT_SECRET", "KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD",
              "KEYCLOAK_BOOTSTRAP_ENABLED", "GRAFANA_ADMIN_USER", "GRAFANA_ADMIN_PASSWORD",
              "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "SLACK_WEBHOOK_URL")}
          domain = os.environ["DOMAIN"]
          values |= {
              "APP_DOMAIN": f"app.{domain}", "KEYCLOAK_DOMAIN": f"auth.{domain}",
              "GRAFANA_DOMAIN": f"grafana.{domain}",
              "APP_PUBLIC_URL": f"https://app.{domain}",
              "KEYCLOAK_PUBLIC_URL": f"https://auth.{domain}",
              "GRAFANA_URL": f"https://grafana.{domain}",
          }
          with open("deploy.env", "w") as output:
              output.writelines(f"export {key}={shlex.quote(value)}\n" for key, value in values.items())
          PY
          chmod 600 deploy.env

      - name: Deploy Compose project
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh target docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          tar -czf release.tgz compose.yaml compose.prod.yaml Caddyfile keycloak telemetry
          scp release.tgz deploy.env target:/tmp/
          ssh target <<'SH'
          set -eu
          install -d -m 700 /opt/qa-final-project
          tar -xzf /tmp/release.tgz -C /opt/qa-final-project
          install -m 600 /tmp/deploy.env /opt/qa-final-project/deploy.env
          cd /opt/qa-final-project
          . ./deploy.env
          docker compose -f compose.yaml -f compose.prod.yaml --profile app pull
          docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --no-build --remove-orphans
          rm -f /tmp/release.tgz /tmp/deploy.env
          SH

      - name: Verify deployment
        run: |
          for _ in {1..36}; do
            curl -fsS "https://app.${DOMAIN}/actuator/health" && exit 0
            sleep 10
          done
          exit 1
