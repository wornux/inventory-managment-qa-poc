x-runtime: &runtime
  restart: unless-stopped

services:
  app:
    <<: *runtime
    image: ${APP_IMAGE:?Set APP_IMAGE}
    build: !reset null
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_BOOTSTRAP_ENABLED: ${KEYCLOAK_BOOTSTRAP_ENABLED:-true}

  postgres:
    <<: *runtime

  keycloak-postgres:
    <<: *runtime

  keycloak:
    <<: *runtime
    command: [start, --import-realm]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}

  prometheus:
    <<: *runtime
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver

  alertmanager:
    <<: *runtime

  loki:
    <<: *runtime

  tempo:
    <<: *runtime

  alloy:
    <<: *runtime

  grafana:
    <<: *runtime
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:?Set GRAFANA_URL}

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:?Set KEYCLOAK_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?Set GRAFANA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, keycloak, grafana]
    networks: [observability]

volumes:
  caddy_data:
  caddy_config:
